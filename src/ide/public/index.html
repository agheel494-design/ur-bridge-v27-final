<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>UR IDE</title>
<style>
  :root {
    --bg: #1e1e1e; --bg-panel: #252526; --bg-header: #2d2d30;
    --border: #3c3c3c; --text: #d4d4d4; --text-dim: #858585;
    --accent: #0e7c3f; --accent-hover: #0f9a4d; --error: #f14c4c; --warn: #cca700;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { background: var(--bg-header); border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  header .title { font-weight: 600; margin-right: 12px; }
  header .filename { color: var(--text-dim); font-size: 13px; margin-right: auto; }
  button { background: #3c3c3c; color: var(--text); border: 1px solid var(--border); border-radius: 3px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #4a4a4a; }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.primary:hover { background: var(--accent-hover); }
  #main { flex: 1; display: flex; min-height: 0; }
  #editor { flex: 1; }
  #bottom { height: 220px; border-top: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  #tabs { display: flex; background: var(--bg-header); border-bottom: 1px solid var(--border); }
  #tabs .tab { padding: 6px 16px; cursor: pointer; font-size: 12px; color: var(--text-dim); border-right: 1px solid var(--border); }
  #tabs .tab.active { color: var(--text); background: var(--bg-panel); }
  #panels { flex: 1; overflow: auto; background: var(--bg-panel); font-family: "SF Mono", Consolas, monospace; font-size: 12px; padding: 8px 12px; white-space: pre-wrap; }
  .panel { display: none; }
  .panel.active { display: block; }
  .diag-error { color: var(--error); margin-bottom: 6px; }
  .diag-line { color: var(--text-dim); }
  #terminal-input-row { display: flex; border-top: 1px solid var(--border); }
  #terminal-input-row span { padding: 6px 4px 6px 12px; color: var(--accent-hover); font-family: monospace; }
  #terminal-input { flex: 1; background: var(--bg-panel); color: var(--text); border: none; outline: none; font-family: monospace; font-size: 12px; padding: 6px 0; }
  .status-ok { color: var(--accent-hover); }
  .status-fail { color: var(--error); }
</style>
</head>
<body>
<header>
  <span class="title">UR IDE</span>
  <button id="btn-new">New</button>
  <button id="btn-open">Open</button>
  <button id="btn-save">Save</button>
  <span class="filename" id="filename">hello.ur (unsaved)</span>
  <button id="btn-run" class="primary">Run</button>
  <button id="btn-build" class="primary">Build</button>
</header>
<div id="main"><div id="editor"></div></div>
<div id="bottom">
  <div id="tabs">
    <div class="tab active" data-panel="output">Output</div>
    <div class="tab" data-panel="errors">Problems</div>
    <div class="tab" data-panel="terminal">Terminal</div>
  </div>
  <div id="panels">
    <div class="panel active" id="panel-output">Ready.</div>
    <div class="panel" id="panel-errors">No problems.</div>
    <div class="panel" id="panel-terminal"><div id="terminal-log"></div></div>
  </div>
  <div id="terminal-input-row" style="display:none">
    <span>$</span>
    <input id="terminal-input" placeholder="Type a command and press Enter..." />
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script>
let currentPath = "hello.ur";
let editor = null;

require.config({ paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs" } });
require(["vs/editor/editor.main"], function () {
  monaco.languages.register({ id: "ur" });
  monaco.languages.setMonarchTokensProvider("ur", {
    keywords: [
      "function", "func", "let", "var", "type", "struct", "import",
      "return", "end", "if", "else", "while", "for", "break", "continue",
      "true", "false", "null", "in"
    ],
    tokenizer: {
      root: [
        [/"([^"\\]|\\.)*"/, "string"],
        [/\d+\.\d+/, "number.float"],
        [/\d+/, "number"],
        [/\/\/.*$/, "comment"],
        [/[a-zA-Z_][\w]*/, { cases: { "@keywords": "keyword", "@default": "identifier" } }]
      ]
    }
  });

  editor = monaco.editor.create(document.getElementById("editor"), {
    value: "function main(): int\n  print(\"hello from UR\")\n  return 0\nend\n",
    language: "ur",
    theme: "vs-dark",
    fontSize: 14,
    automaticLayout: true,
    minimap: { enabled: false }
  });
});

function setPanel(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.panel === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
  document.getElementById("terminal-input-row").style.display = name === "terminal" ? "flex" : "none";
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setPanel(t.dataset.panel)));

function showOutput(text, ok) {
  const el = document.getElementById("panel-output");
  el.textContent = text;
  el.className = "panel active " + (ok ? "status-ok" : "status-fail");
  setPanel("output");
}

function showDiagnostics(diags) {
  const el = document.getElementById("panel-errors");
  if (!diags || diags.length === 0) {
    el.textContent = "No problems.";
    return;
  }
  el.innerHTML = diags.map(d =>
    "<div class='diag-error'>[" + d.code + "] " + d.message + "</div><div class='diag-line'>line " + d.line + ", column " + d.column + "</div>"
  ).join("<hr style='border-color:#3c3c3c'>");
  setPanel("errors");

  if (editor) {
    const markers = diags.map(d => ({
      severity: monaco.MarkerSeverity.Error,
      message: d.message,
      startLineNumber: d.line, startColumn: d.column,
      endLineNumber: d.endLine, endColumn: d.endColumn + 1
    }));
    monaco.editor.setModelMarkers(editor.getModel(), "ur", markers);
  }
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}

document.getElementById("btn-new").addEventListener("click", async () => {
  const name = prompt("New file name:", "hello.ur");
  if (!name) return;
  const res = await api("/api/new", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: name }) });
  if (res.error) { alert(res.error); return; }
  currentPath = name;
  document.getElementById("filename").textContent = name;
  editor.setValue(res.content);
});

document.getElementById("btn-open").addEventListener("click", async () => {
  const name = prompt("File to open:", currentPath);
  if (!name) return;
  const res = await api("/api/open?path=" + encodeURIComponent(name));
  if (res.error) { alert(res.error); return; }
  currentPath = name;
  document.getElementById("filename").textContent = name;
  editor.setValue(res.content);
});

document.getElementById("btn-save").addEventListener("click", async () => {
  const content = editor.getValue();
  const res = await api("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: currentPath, content }) });
  if (res.error) { alert(res.error); return; }
  document.getElementById("filename").textContent = currentPath + " (saved)";
});

document.getElementById("btn-run").addEventListener("click", async () => {
  const content = editor.getValue();
  showOutput("Running...", true);
  const res = await api("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: currentPath, content }) });
  if (!res.ok) {
    showDiagnostics(res.diagnostics);
    showOutput(res.backendError || "Compilation failed - see Problems tab.", false);
    return;
  }
  showDiagnostics([]);
  let out = res.stdout || "";
  if (res.stderr) out += "\n[stderr]\n" + res.stderr;
  out += "\n\n(exit code: " + res.exitCode + (res.signal ? ", signal: " + res.signal : "") + ")";
  showOutput(out, res.exitCode === 0);
});

document.getElementById("btn-build").addEventListener("click", async () => {
  const content = editor.getValue();
  showOutput("Building...", true);
  const res = await api("/api/build", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: currentPath, content }) });
  if (!res.ok) {
    showDiagnostics(res.diagnostics);
    showOutput(res.backendError || "Build failed - see Problems tab.", false);
    return;
  }
  showDiagnostics([]);
  showOutput("Built: " + res.outputPath, true);
});

const terminalInput = document.getElementById("terminal-input");
terminalInput.addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;
  const command = terminalInput.value;
  if (!command.trim()) return;
  terminalInput.value = "";
  const log = document.getElementById("terminal-log");
  log.innerHTML += "<div>$ " + command + "</div>";
  const res = await api("/api/terminal", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ command }) });
  log.innerHTML += "<div>" + ((res.stdout || "") + (res.stderr || "")).replace(/</g, "&lt;") + "</div>";
  document.getElementById("panels").scrollTop = document.getElementById("panels").scrollHeight;
});
</script>
</body>
</html>
